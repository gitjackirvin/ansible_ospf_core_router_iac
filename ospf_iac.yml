name: Configure OSPF on Core Routers
  hosts: ospf_routers
  gather_facts: false

  vars:
    router_configs:
      "router2": { router_id: "2.2.2.2", network: "10.10.10.0" }
      "router3": { router_id: "3.3.3.3", network: "10.10.10.4" }
      "router4": { router_id: "4.4.4.4", network: "10.10.10.8" }
      "router5": { router_id: "5.5.5.5", network: "10.10.10.12" }
      "router6": { router_id: "6.6.6.6", network: "10.10.10.16" }

  tasks:
    - name: Apply OSPFv2 configuration per device
      cisco.ios.ios_ospfv2:
        config:
          processes:
            - process_id: 1
              router_id: "{{ router_configs[inventory_hostname].router_id }}"
              network:
                - address: "{{ router_configs[inventory_hostname].network }}"
                  wildcard_bits: "0.0.0.3"
                  area: 0
        state: merged

    - name: Commit changes to startup-config
      cisco.ios.ios_command:
        commands:
          - write memory
